id: tool_recovery_003
category: tool_recovery
kind: code_change
title: 为弃用 API 提供兼容层
prompt: '旧代码用 legacy.get_value() 读取配置，但该模块已重命名为 config，且方法改名为 fetch()。运行 legacy 用户代码会报
  ModuleNotFoundError。

  请提供一个兼容层（shim），让 from legacy import get_value 仍可用，内部委托给新的 config.fetch，且不破坏新模块。'
timeout_seconds: 300
max_retries: 0
difficulty: hard
labels: []
grader:
  type: fail_to_pass
